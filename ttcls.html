<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Tóm tắt CLS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20384%20512%22%3E%3Cpath%20fill%3D%22%230d9488%22%20d%3D%22M192%20512C86%20512%200%20426%200%20320%200%20228%2075%20128%20192%200%20309%20128%20384%20228%20384%20320c0%20106-86%20192-192%20192z%22%2F%3E%3C%2Fsvg%3E">
  <style>
    /* =========================================================
       DESIGN TOKENS — Clinical Teal + Stone
       ========================================================= */
    :root {
      /* Surfaces */
      --bg: #f5f5f4;
      --bg-tint: #fafaf9;
      --surface: #ffffff;
      --surface-2: #fafaf9;
      --surface-hover: #f5f5f4;
      --border: #e7e5e4;
      --border-strong: #d6d3d1;

      /* Text */
      --text: #1c1917;
      --text-muted: #57534e;
      --text-faint: #a8a29e;

      /* Brand */
      --primary: #0d9488;
      --primary-hover: #0f766e;
      --primary-text: #0f766e;
      --primary-soft: #ccfbf1;
      --primary-faint: #f0fdfa;

      /* Semantic */
      --abn: #dc2626;
      --abn-text: #b91c1c;
      --abn-soft: #fee2e2;
      --abn-faint: #fef2f2;
      --norm: #16a34a;
      --norm-text: #15803d;
      --norm-soft: #dcfce7;
      --norm-faint: #f0fdf4;
      --warn: #ca8a04;
      --warn-soft: #fef9c3;

      /* Radii */
      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 14px;
      --r-xl: 20px;
      --r-full: 9999px;

      /* Shadows */
      --sh-sm: 0 1px 2px rgba(28,25,23,0.06);
      --sh-md: 0 4px 12px rgba(28,25,23,0.08), 0 1px 2px rgba(28,25,23,0.04);
      --sh-lg: 0 12px 32px rgba(28,25,23,0.10), 0 4px 8px rgba(28,25,23,0.06);

      /* Motion */
      --t: 150ms ease;
      --t-slow: 250ms cubic-bezier(0.4, 0, 0.2, 1);

      /* Fonts */
      --f-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --f-display: 'Sora', 'Inter', sans-serif;
      --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body.dark-mode {
      --bg: #0c0a09;
      --bg-tint: #1c1917;
      --surface: #1c1917;
      --surface-2: #292524;
      --surface-hover: #292524;
      --border: #292524;
      --border-strong: #44403c;

      --text: #f5f5f4;
      --text-muted: #a8a29e;
      --text-faint: #57534e;

      --primary: #14b8a6;
      --primary-hover: #2dd4bf;
      --primary-text: #5eead4;
      --primary-soft: #134e4a;
      --primary-faint: #042f2e;

      --abn: #f87171;
      --abn-text: #fca5a5;
      --abn-soft: #7f1d1d;
      --abn-faint: #3f1d1d;
      --norm: #4ade80;
      --norm-text: #86efac;
      --norm-soft: #14532d;
      --norm-faint: #14301e;
      --warn: #facc15;
      --warn-soft: #422006;

      --sh-sm: 0 1px 2px rgba(0,0,0,0.4);
      --sh-md: 0 4px 12px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
      --sh-lg: 0 12px 32px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.4);
    }

    /* =========================================================
       RESET & BASE
       ========================================================= */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
	.hidden { display: none !important; }
    body {
      font-family: var(--f-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding: 0;
      transition: background-color 0.25s, color 0.25s;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea, select { font-family: inherit; color: inherit; }

    kbd {
      font-family: var(--f-mono);
      font-size: 0.72em;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.12);
      font-weight: 500;
      opacity: 0.75;
      margin-left: 4px;
    }
    body.dark-mode kbd {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.15);
    }

    /* =========================================================
       APP SHELL
       ========================================================= */
    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* =========================================================
       APP BAR (Header)
       ========================================================= */
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 4px;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: saturate(180%) blur(8px);
      -webkit-backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid transparent;
      transition: border-color var(--t), background-color var(--t);
    }
    .app-bar.scrolled {
      border-bottom-color: var(--border);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--primary-hover));
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 15px;
      box-shadow: 0 4px 10px -2px rgba(13, 148, 136, 0.4);
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-title {
      font-family: var(--f-display);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .brand-sub {
      font-size: 10.5px;
      color: var(--text-faint);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .app-actions { display: flex; align-items: center; gap: 4px; }

    .icon-btn {
      width: 36px; height: 36px;
      border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      font-size: 15px;
      transition: background var(--t), color var(--t);
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn.active { background: var(--primary-faint); color: var(--primary-text); }

    /* =========================================================
       WORKSPACE (Split Layout)
       ========================================================= */
    .workspace {
      display: grid;
      gap: 20px;
      margin-top: 20px;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      align-items: start;
    }

    /* =========================================================
       CARD
       ========================================================= */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--sh-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.25s, border-color 0.25s;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .card-title {
      font-family: var(--f-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title i { color: var(--primary); font-size: 12px; }
    .card-head-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

    /* =========================================================
       BUTTONS
       ========================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--r-md);
      font-size: 13.5px;
      font-weight: 600;
      transition: background var(--t), color var(--t), border-color var(--t), box-shadow var(--t);
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 6px -2px rgba(13, 148, 136, 0.4);
    }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px -2px rgba(13, 148, 136, 0.5); }
    .btn-primary:active { transform: translateY(1px); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }

    .btn-outline {
      background: transparent;
      color: var(--primary-text);
      border: 1px solid var(--primary);
    }
    .btn-outline:hover { background: var(--primary-faint); }

    /* Chip button (small toggles) */
    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: var(--r-full);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      transition: all var(--t);
      white-space: nowrap;
    }
    .chip-btn:hover { border-color: var(--border-strong); color: var(--text); }
    .chip-btn.active {
      background: var(--primary-faint);
      border-color: var(--primary);
      color: var(--primary-text);
    }
    .chip-btn.active i { color: var(--primary); }

    .icon-sm-btn {
      width: 28px; height: 28px;
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint);
      font-size: 12px;
      transition: all var(--t);
    }
    .icon-sm-btn:hover { background: var(--surface-2); color: var(--text); }

    /* =========================================================
       INPUT CARD
       ========================================================= */
    .card-input { position: relative; }
    .input-wrap {
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #dataInput {
      width: 100%;
      height: 160px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: var(--surface-2);
      color: var(--text);
      font-family: var(--f-mono);
      font-size: 12.5px;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      transition: border-color var(--t), box-shadow var(--t);
      scrollbar-width: thin;
    }
    #dataInput::placeholder { color: var(--text-faint); font-family: var(--f-sans); }
    #dataInput:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }
    #dataInput::-webkit-scrollbar { width: 8px; }
    #dataInput::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    .input-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .input-actions .btn-primary { flex: 1; min-width: 140px; }

    /* Recent chips */
    .recent-block {
      padding: 0 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .recent-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-faint);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .recent-label i { font-size: 10px; }
    .recent-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .recent-chips::-webkit-scrollbar { height: 4px; }
    .recent-chips::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
    .recent-chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--r-full);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 500;
      transition: all var(--t);
    }
    .recent-chip:hover {
      border-color: var(--primary);
      color: var(--primary-text);
      background: var(--primary-faint);
    }
    .recent-chip .time { color: var(--text-faint); font-family: var(--f-mono); font-size: 10.5px; }

    /* =========================================================
       OUTPUT CARD
       ========================================================= */
    .card-output { position: relative; }
    .card-output.animate-pulse::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 2px solid var(--primary);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      animation: pulseFade 0.8s ease-out;
    }
    @keyframes pulseFade {
      from { opacity: 0.7; }
      to { opacity: 0; }
    }

    .summary-body {
      padding: 16px 18px;
      min-height: 180px;
      max-height: 48vh;
      overflow-y: auto;
      font-family: var(--f-mono);
      font-size: 13.5px;
      line-height: 1.85;
      color: var(--text);
      scrollbar-width: thin;
      word-break: break-word;
    }
    .summary-body::-webkit-scrollbar { width: 8px; }
    .summary-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    .summary-body .abnormal-value {
      color: var(--abn-text);
      background: var(--abn-faint);
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px;
      color: var(--text-faint);
      font-family: var(--f-sans);
    }
    .empty-state i {
      font-size: 36px;
      opacity: 0.3;
      margin-bottom: 10px;
      color: var(--primary);
    }
    .empty-state p { font-size: 13px; }
    .empty-state.error i { color: var(--abn); }
    .empty-state.error p { color: var(--abn-text); }

    /* Stats footer */
    .card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
      flex-wrap: wrap;
    }
    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--r-full);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .stat-chip .stat-value {
      font-family: var(--f-mono);
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-size: 12.5px;
    }
    .stat-chip.abn {
      background: var(--abn-faint);
      border-color: color-mix(in srgb, var(--abn) 40%, transparent);
    }
    .stat-chip.abn .stat-value { color: var(--abn-text); }

    .btn-view-detail {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--r-full);
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 600;
      transition: background var(--t);
    }
    .btn-view-detail:hover { background: var(--primary-hover); }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--r-md);
      background: var(--primary);
      color: white;
      font-size: 12.5px;
      font-weight: 600;
      transition: all var(--t);
    }
    .btn-copy:hover { background: var(--primary-hover); }
    .btn-copy.copied { background: var(--norm); }

    /* =========================================================
       QUICK COPY SECTION
       ========================================================= */
    .card-quick { margin-top: 20px; }
    .quick-search {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--r-full);
      border: 1px solid var(--border);
      background: var(--surface-2);
      transition: all var(--t);
    }
    .quick-search:focus-within {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }
    .quick-search i { color: var(--text-faint); font-size: 11px; }
    .quick-search input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 12.5px;
      color: var(--text);
      width: 160px;
    }
    .quick-search input::placeholder { color: var(--text-faint); }

    .quick-tabs {
      display: flex;
      gap: 4px;
      padding: 10px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .quick-tabs::-webkit-scrollbar { display: none; }
    .quick-tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: var(--r-full);
      background: transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 500;
      transition: all var(--t);
      white-space: nowrap;
    }
    .quick-tab:hover { background: var(--surface-2); color: var(--text); }
    .quick-tab.active {
      background: var(--primary-faint);
      color: var(--primary-text);
      font-weight: 600;
    }

    .quick-cards {
      padding: 12px 14px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 8px;
    }
    .quick-card {
      display: flex;
      align-items: stretch;
      gap: 8px;
      padding: 10px 12px;
      border-radius: var(--r-md);
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: all var(--t);
      cursor: pointer;
    }
    .quick-card:hover {
      border-color: var(--primary);
      background: var(--primary-faint);
    }
    .quick-card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .quick-card-cat {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-faint);
      font-weight: 600;
    }
    .quick-card-text {
      font-size: 12.5px;
      color: var(--text);
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .quick-card-copy {
      align-self: center;
      width: 30px; height: 30px;
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 11px;
      transition: all var(--t);
      flex-shrink: 0;
    }
    .quick-card:hover .quick-card-copy {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .empty-quick {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px 16px;
      color: var(--text-faint);
      font-size: 13px;
    }

    /* =========================================================
       DRAWER (Chi tiết)
       ========================================================= */
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(480px, 100vw);
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 32px rgba(0,0,0,0.15);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform var(--t-slow);
    }
    .drawer.open { transform: translateX(0); }
    body.dark-mode .drawer { box-shadow: -8px 0 32px rgba(0,0,0,0.6); }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(12, 10, 9, 0.45);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 200ms, visibility 200ms;
    }
    .drawer-backdrop.open { opacity: 1; visibility: visible; }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .drawer-head h3 {
      font-family: var(--f-display);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .drawer-toolbar {
      display: flex;
      gap: 6px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .drawer-toolbar .chip-btn { font-size: 11.5px; }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .drawer-body::-webkit-scrollbar { width: 8px; }
    .drawer-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    .detail-row {
      display: grid;
      grid-template-columns: 18px 28px 1fr auto 12px;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--t);
      font-size: 13px;
    }
    .detail-row:hover { background: var(--surface-2); }
    .detail-row.selected { background: var(--primary-faint); }
    .detail-row.is-abn.selected { background: color-mix(in srgb, var(--abn-faint) 60%, var(--primary-faint)); }

    .detail-row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .detail-stt {
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--text-faint);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .detail-info { min-width: 0; }
    .detail-name {
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detail-meta {
      font-family: var(--f-mono);
      font-size: 10.5px;
      color: var(--text-faint);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-value {
      font-family: var(--f-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .detail-value.abn { color: var(--abn-text); }

    .detail-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .detail-dot.norm { background: var(--norm); }
    .detail-dot.abn { background: var(--abn); }
    .detail-dot.unk { background: var(--text-faint); }

    .empty-drawer {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-faint);
      font-size: 13px;
    }

    .drawer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
      flex-shrink: 0;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .drawer-footer b {
      font-family: var(--f-mono);
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================
       MODALS (Settings, Add/Edit item)
       ========================================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(12, 10, 9, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
      transition: opacity 0.2s;
    }
    .modal-overlay.hidden { opacity: 0; pointer-events: none; }
    .modal-box {
      background: var(--surface);
      border-radius: var(--r-xl);
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--sh-lg);
      border: 1px solid var(--border);
      transform: scale(0.97) translateY(8px);
      transition: transform 200ms cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }
    .modal-overlay:not(.hidden) .modal-box { transform: scale(1) translateY(0); }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-head h3 {
      font-family: var(--f-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-head h3 i { color: var(--primary); font-size: 14px; }

    .modal-body {
      padding: 18px 22px;
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
    }
    .modal-body::-webkit-scrollbar { width: 8px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-btn {
      padding: 8px 14px;
      border-radius: var(--r-md);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      transition: all var(--t);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover { background: var(--surface-2); color: var(--text); }
    .tab-btn.active {
      background: var(--primary-faint);
      color: var(--primary-text);
      font-weight: 600;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Form fields */
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: var(--surface-2);
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: all var(--t);
    }
    .field textarea { min-height: 100px; resize: vertical; font-family: inherit; }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }

    /* Abbr list */
    .abbr-list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 12.5px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 8px;
    }
    .abbr-list {
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      overflow: hidden;
    }
    .abbr-row {
      display: grid;
      grid-template-columns: 1fr 90px auto;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
    }
    .abbr-row:last-child { border-bottom: none; }
    .abbr-row .raw { color: var(--text); font-weight: 500; word-break: break-word; }
    .abbr-row .short {
      color: var(--primary-text);
      font-family: var(--f-mono);
      font-weight: 600;
      font-size: 12px;
      text-align: center;
    }
    .abbr-row .actions { display: flex; gap: 4px; justify-content: flex-end; }

    /* Add abbr box */
    .add-box {
      padding: 16px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--r-md);
      background: var(--surface-2);
    }
    .add-box-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .add-box .field:last-of-type { margin-bottom: 12px; }

    /* =========================================================
       CONTEXT MENU
       ========================================================= */
    .custom-context-menu {
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--sh-lg);
      padding: 4px;
      min-width: 160px;
      z-index: 3000;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: var(--r-sm);
      font-size: 12.5px;
      color: var(--text);
      cursor: pointer;
      transition: background var(--t);
    }
    .menu-item:hover { background: var(--surface-2); }
    .menu-item.delete { color: var(--abn-text); }
    .menu-item.delete:hover { background: var(--abn-faint); }

    /* =========================================================
       TOAST
       ========================================================= */
    .toast-message {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--surface);
      padding: 10px 20px;
      border-radius: var(--r-full);
      font-size: 13px;
      font-weight: 500;
      z-index: 5000;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--sh-lg);
      opacity: 0;
      animation: toastIn 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
    }
    @keyframes toastIn {
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .toast-message.fade-out {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      transition: opacity 0.3s, transform 0.3s;
    }
    .toast-message i { color: var(--norm); }

    /* =========================================================
       SCROLL TOP
       ========================================================= */
    .scroll-top-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(13, 148, 136, 0.4);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px) scale(0.9);
      transition: all 0.25s;
    }
    .scroll-top-btn.visible { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
    .scroll-top-btn:hover { background: var(--primary-hover); transform: translateY(-2px) scale(1.05); }

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media (max-width: 1023px) {
      .workspace { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .app-shell { padding: 0 12px 80px; }
      .app-bar { height: 52px; }
      .brand-title { font-size: 14px; }
      .brand-sub { display: none; }
      .card-head { padding: 12px 14px; }
      .input-wrap { padding: 12px 14px; }
      .summary-body { padding: 14px; font-size: 12.5px; min-height: 140px; }
      .card-footer { padding: 8px 12px; }
      .stat-chip { padding: 4px 8px; font-size: 11px; }
      .btn-view-detail { padding: 5px 10px; font-size: 11px; }
      .btn-copy { padding: 5px 10px; font-size: 11.5px; }
      #dataInput { height: 130px; font-size: 12px; }
      .input-actions .btn { padding: 8px 12px; font-size: 12.5px; }
      .drawer { width: 100vw; }
      .detail-row { padding: 10px 14px; }
      .quick-search input { width: 100px; }
    }

    @media (max-width: 480px) {
      .app-actions .icon-btn { width: 32px; height: 32px; font-size: 14px; }
      .quick-search { padding: 5px 10px; }
      .quick-search input { width: 80px; font-size: 12px; }
      .modal-box { max-height: 92vh; }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
	.custom-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--sh-lg);
      min-width: 180px;
      padding: 4px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- ======================= APP BAR ======================= -->
    <header class="app-bar" id="appBar">
      <div class="brand">
        <div class="brand-icon"><i class="fas fa-stethoscope"></i></div>
        <div class="brand-text">
          <span class="brand-title">Tóm tắt CLS</span>
        </div>
      </div>
      <nav class="app-actions">
        <button class="icon-btn" id="toggleTableBtn" data-tooltip="Chi tiết chỉ số" title="Chi tiết chỉ số">
          <i class="fas fa-list-ul"></i>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Cài đặt viết tắt">
          <i class="fas fa-cog"></i>
        </button>
        <button class="icon-btn" id="themeToggle" title="Giao diện sáng/tối">
          <i class="fas fa-sun"></i>
        </button>
      </nav>
    </header>

    <!-- ======================= WORKSPACE ======================= -->
    <main class="workspace">

      <!-- ============= INPUT CARD ============= -->
      <section class="card card-input">
        <div class="card-head">
          <h2 class="card-title"><i class="fas fa-paste"></i> Dán dữ liệu</h2>
          <div class="card-head-actions">
            <button class="chip-btn" id="autoToggleBtn" title="Tự động tóm tắt khi dán">
              <i class="fas fa-robot"></i> <span>Tự động</span>
            </button>
            <button class="icon-sm-btn" id="clearTextBtn" title="Xóa nhanh">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <div class="input-wrap">
          <textarea id="dataInput"
            placeholder="Dán dữ liệu xét nghiệm (copy từ LIS/HIS)…
Ví dụ:
1	(H01) Số lượng hồng cầu	4.60	4 - 5.8	x10^12/L
2	(H02) Huyết sắc tố	90	140 - 160	g/L
3	(H03) Số lượng tiểu cầu	420	150 - 400	x10^9/L
4	(B04) Glucose	6.5	4.1-5.9	mmol/L"></textarea>

          <div class="input-actions">
            <button class="btn btn-primary" id="summarizeBtn">
              <i class="fas fa-bolt"></i> Tóm tắt <kbd>⌘↵</kbd>
            </button>
            <button class="btn btn-ghost" id="clearBtn">
              <i class="fas fa-trash-alt"></i> Làm mới
            </button>
          </div>
        </div>

        <div class="recent-block hidden" id="recentBlock">
          <div class="recent-label"><i class="fas fa-history"></i> Gần đây</div>
          <div class="recent-chips" id="recentChips"></div>
        </div>
      </section>

      <!-- ============= OUTPUT CARD ============= -->
      <section class="card card-output" id="outputCard">
        <div class="card-head">
          <h2 class="card-title"><i class="fas fa-clipboard-check"></i> Kết quả</h2>
          <div class="card-head-actions">
            <!-- Format dropdown -->
            <div style="position: relative;">
              <button class="chip-btn" id="formatDropdownToggle">
                <i class="fas fa-list-ul"></i> <span id="formatLabel">Phẩy</span>
              </button>
              <div class="custom-dropdown-menu hidden" id="formatDropdownMenu">
				  <div class="menu-item" data-value="comma"><i class="fas fa-check"></i> Dấu phẩy (,)</div>
				  <div class="menu-item" data-value="semicolon"><i class="fas fa-check"></i> Chấm phẩy (;)</div>
				  <div class="menu-item" data-value="newline"><i class="fas fa-check"></i> Xuống dòng</div>
				</div>
            </div>

            <button class="chip-btn" id="toggleUnitBtn" title="Ẩn/hiện đơn vị">
              <i class="fas fa-eye-slash" id="unitIcon"></i> <span id="unitBtnText">Đơn vị</span>
            </button>
            <button class="chip-btn" id="toggleAbbrBtn" title="Chuyển tên đầy đủ / viết tắt">
              <i class="fas fa-font" id="abbrIcon"></i> <span id="abbrBtnText">Tên đủ</span>
            </button>

            <button class="btn-copy" id="copySummaryBtn" title="Copy tóm tắt (⌘⇧C)">
              <i class="fas fa-copy"></i> Copy
            </button>
          </div>
        </div>

        <div class="summary-body" id="summaryText">
          <div class="empty-state">
            <i class="fas fa-file-medical-alt"></i>
            <p>Chưa có dữ liệu. Dán kết quả xét nghiệm vào ô bên trái.</p>
          </div>
        </div>

        <div class="card-footer">
          <div class="stat-chip">
            <span class="stat-value" id="totalIndicators">0</span>
            <span>Tổng</span>
          </div>
          <div class="stat-chip abn">
            <span class="stat-value" id="abnormalIndicators">0</span>
            <span>Bất thường</span>
          </div>
          <div class="stat-chip">
            <span class="stat-value" id="selectedCountBadge">0/0</span>
            <span>Đã chọn</span>
          </div>
          <button class="btn-view-detail" id="openDrawerBtn">
            <i class="fas fa-list-ul"></i> Chi tiết
          </button>
        </div>
      </section>
    </main>

    <!-- ============= QUICK COPY ============= -->
    <section class="card card-quick">
      <div class="card-head">
        <h2 class="card-title"><i class="fas fa-bolt"></i> Mẫu copy nhanh</h2>
        <div class="card-head-actions">
          <label class="quick-search">
            <i class="fas fa-search"></i>
            <input type="search" id="quickSearch" placeholder="Tìm mẫu…" autocomplete="off">
          </label>
          <button class="btn btn-outline" id="btnAddQuickCopy">
            <i class="fas fa-plus"></i> Thêm
          </button>
        </div>
      </div>
      <div class="quick-tabs" id="quickTabs"></div>
      <div class="quick-cards" id="quickCopyGrid"></div>
    </section>

  </div>

  <!-- ======================= DRAWER ======================= -->
  <aside class="drawer" id="tableContainer">
    <div class="drawer-head">
      <h3><i class="fas fa-list-ul" style="color: var(--primary); margin-right: 6px;"></i>Chi tiết chỉ số</h3>
      <button class="icon-sm-btn" id="drawerClose" title="Đóng"><i class="fas fa-times"></i></button>
    </div>

    <div class="drawer-toolbar" id="selectionToolbar">
      <button class="chip-btn" id="selectMainBtn"><i class="fas fa-star"></i> Chính</button>
      <button class="chip-btn" id="selectAbnormalBtn"><i class="fas fa-exclamation-triangle"></i> Bất thường</button>
      <button class="chip-btn" id="selectAllBtn"><i class="fas fa-check-double"></i> Tất cả</button>
      <button class="chip-btn" id="deselectAllBtn"><i class="fas fa-times"></i> Bỏ chọn</button>
    </div>

    <div class="drawer-body" id="tableBody"></div>

    <div class="drawer-footer">
      <span>Đã chọn: <b id="drawerCount">0/0</b></span>
      <button class="btn btn-primary" id="drawerApply" style="padding: 6px 14px; font-size: 12.5px;">Xong</button>
    </div>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <!-- ======================= MODAL: SETTINGS ======================= -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3><i class="fas fa-cog"></i> Quản lý viết tắt</h3>
        <button class="icon-sm-btn" id="btnCloseSettings"><i class="fas fa-times"></i></button>
      </div>

      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="tabList"><i class="fas fa-list"></i> Danh sách</button>
        <button class="tab-btn" data-tab="tabAdd"><i class="fas fa-plus-circle"></i> Thêm mới</button>
      </div>

      <div id="tabList" class="tab-content active modal-body">
        <div class="abbr-list-head">
          <span>Đã có <b id="abbrCountBadge" style="font-family:var(--f-mono);color:var(--text);">0</b> mục</span>
          <button class="btn btn-ghost" id="btnResetAbbr" style="padding:5px 10px;font-size:11.5px;">
            <i class="fas fa-undo"></i> Khôi phục mặc định
          </button>
        </div>
        <div class="abbr-list" id="abbrListContainer"></div>
      </div>

      <div id="tabAdd" class="tab-content modal-body">
        <div class="add-box">
          <div class="add-box-title" id="abbrFormTitle"><i class="fas fa-plus-circle"></i> Thêm chỉ số mới</div>
          <div class="field">
            <label>Tên gốc</label>
            <input type="hidden" id="editAbbrId" value="">
            <input type="text" id="newAbbrKey" placeholder="VD: Glucose">
          </div>
          <div class="field">
            <label>Viết tắt</label>
            <input type="text" id="newAbbrValue" placeholder="VD: Glu">
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary" id="btnAddAbbr" style="flex:1;">
              <i class="fas fa-save"></i> Lưu
            </button>
            <button class="btn btn-ghost hidden" id="btnCancelEditAbbr" style="flex:1;">
              <i class="fas fa-times"></i> Hủy
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ======================= MODAL: ADD/EDIT QUICK COPY ======================= -->
  <div id="itemModal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width: 520px;">
      <div class="modal-head">
        <h3 id="modalTitle"><i class="fas fa-plus-circle"></i> Thêm mẫu mới</h3>
        <button class="icon-sm-btn" id="modalCloseBtn"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Nhóm</label>
          <select id="modalCategorySelect"></select>
          <input type="text" id="modalCategoryInput" placeholder="Nhập tên nhóm mới…" style="display:none;margin-top:8px;">
        </div>
        <div class="field">
          <label>Nội dung</label>
          <textarea id="modalContent" placeholder="Nhập đoạn văn bản cần copy nhanh…"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="modalCancel">Hủy</button>
        <button class="btn btn-primary" id="modalSave">Lưu lại</button>
      </div>
    </div>
  </div>

  <!-- ======================= CONTEXT MENU ======================= -->
  <div id="contextMenu" class="custom-context-menu hidden">
    <div class="menu-item" id="menuEdit"><i class="fas fa-edit" style="width:14px;"></i> Chỉnh sửa</div>
    <div class="menu-item delete" id="menuDelete"><i class="fas fa-trash-alt" style="width:14px;"></i> Xóa</div>
  </div>

  <div id="scrollTopBtn" class="scroll-top-btn" title="Lên đầu trang"><i class="fas fa-arrow-up"></i></div>

  <!-- ======================= SCRIPTS ======================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove, serverTimestamp, increment, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBO0lJNyz9N4sr5z_FZyQgX_tWXD0XH82g",
      authDomain: "tomtatcls.firebaseapp.com",
      databaseURL: "https://tomtatcls-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "tomtatcls",
      storageBucket: "tomtatcls.firebasestorage.app",
      messagingSenderId: "898386417757",
      appId: "1:898386417757:web:b1fa660ff3821abf4ad5b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const quickCopyRef = ref(db, 'quickCopyItems');
    const abbrRef = ref(db, 'abbreviations');

    function logPageVisit() {
      const statsRef = ref(db, 'page_visits/stats');
      update(statsRef, { total_views: increment(1) }).catch(() => {});
      push(ref(db, 'page_visits/logs'), {
        timestamp: serverTimestamp(),
        localTime: new Date().toLocaleString('vi-VN'),
        userAgent: navigator.userAgent
      }).catch(() => {});
    }
    logPageVisit();

    (function() {
      // ---------- CONSTANTS ----------
      const STORAGE = {
        SHOW_UNIT: 'showUnit',
        SHOW_ABBR: 'showAbbr',
        COPY_FORMAT: 'copyFormat',
        AUTO_SUMMARIZE: 'autoSummarize',
        THEME: 'theme'
      };
      const HISTORY_KEY = 'cls_history_v1';
      const SPECIAL_NAMES = ["Số lượng hồng cầu","Huyết sắc tố","Hematocrit","Số lượng tiểu cầu","Số lượng bạch cầu","Tỷ lệ bạch cầu GR"];
      const DEFAULT_ABBR_MAP = {
        "Số lượng hồng cầu":"HC","Huyết sắc tố":"Hb","Hematocrit":"HTC",
        "Số lượng tiểu cầu":"TC","Số lượng bạch cầu":"BC","Tỷ lệ bạch cầu GR":"N%"
      };
      const FORMAT_LABELS = { comma: 'Phẩy', semicolon: 'Chấm phẩy', newline: 'Xuống dòng' };

      // ---------- STATE ----------
      let currentAbbrMap = {};
      let firebaseAbbrList = [];
      let showUnit = localStorage.getItem(STORAGE.SHOW_UNIT) === 'true';
      let showAbbr = localStorage.getItem(STORAGE.SHOW_ABBR) !== 'false';
      let copyFormat = localStorage.getItem(STORAGE.COPY_FORMAT) || 'comma';
      let autoSummarizeEnabled = localStorage.getItem(STORAGE.AUTO_SUMMARIZE) !== 'false';
      let currentRows = [];
      let selectedIndices = [];
      let customQuickItems = [];
      let editingQuickId = null, contextMenuTargetId = null;
      let isTableDirty = false;
      let lastSummaryHtml = '';
      let lastTableSignature = '';
      let activeQuickTab = 'all';

      // ---------- DOM ----------
      const $ = (s) => document.querySelector(s);
      const el = {
        dataTextarea: $('#dataInput'),
        summarizeBtn: $('#summarizeBtn'),
        clearBtn: $('#clearBtn'),
        clearTextBtn: $('#clearTextBtn'),
        copySummaryBtn: $('#copySummaryBtn'),
        autoToggleBtn: $('#autoToggleBtn'),
        themeToggle: $('#themeToggle'),
        settingsBtn: $('#settingsBtn'),

        formatDropdownToggle: $('#formatDropdownToggle'),
        formatDropdownMenu: $('#formatDropdownMenu'),
        formatItems: document.querySelectorAll('#formatDropdownMenu .menu-item'),
        formatLabel: $('#formatLabel'),

        toggleUnitBtn: $('#toggleUnitBtn'),
        toggleAbbrBtn: $('#toggleAbbrBtn'),
        unitIcon: $('#unitIcon'),
        abbrIcon: $('#abbrIcon'),
        unitBtnText: $('#unitBtnText'),
        abbrBtnText: $('#abbrBtnText'),

        summaryText: $('#summaryText'),
        outputCard: $('#outputCard'),
        totalIndicatorsSpan: $('#totalIndicators'),
        abnormalIndicatorsSpan: $('#abnormalIndicators'),
        selectedCountBadge: $('#selectedCountBadge'),

        toggleTableBtn: $('#toggleTableBtn'),
        openDrawerBtn: $('#openDrawerBtn'),
        tableContainer: $('#tableContainer'),
        drawerBackdrop: $('#drawerBackdrop'),
        drawerClose: $('#drawerClose'),
        drawerApply: $('#drawerApply'),
        drawerCount: $('#drawerCount'),
        tableBody: $('#tableBody'),
        selectionToolbar: $('#selectionToolbar'),
        selectMainBtn: $('#selectMainBtn'),
        selectAbnormalBtn: $('#selectAbnormalBtn'),
        selectAllBtn: $('#selectAllBtn'),
        deselectAllBtn: $('#deselectAllBtn'),

        recentBlock: $('#recentBlock'),
        recentChips: $('#recentChips'),

        quickCopyGrid: $('#quickCopyGrid'),
        quickTabs: $('#quickTabs'),
        quickSearch: $('#quickSearch'),
        btnAddQuickCopy: $('#btnAddQuickCopy'),

        itemModal: $('#itemModal'),
        modalTitle: $('#modalTitle'),
        modalCloseBtn: $('#modalCloseBtn'),
        catSelect: $('#modalCategorySelect'),
        catInput: $('#modalCategoryInput'),
        modalContent: $('#modalContent'),
        modalCancel: $('#modalCancel'),
        modalSave: $('#modalSave'),

        settingsModal: $('#settingsModal'),
        btnCloseSettings: $('#btnCloseSettings'),
        tabBtns: document.querySelectorAll('.modal-tabs .tab-btn'),
        tabContents: document.querySelectorAll('.modal-tabs ~ .tab-content, .modal-box > .tab-content'),
        abbrListContainer: $('#abbrListContainer'),
        abbrCountBadge: $('#abbrCountBadge'),
        abbrFormTitle: $('#abbrFormTitle'),
        newAbbrKey: $('#newAbbrKey'),
        newAbbrValue: $('#newAbbrValue'),
        editAbbrId: $('#editAbbrId'),
        btnAddAbbr: $('#btnAddAbbr'),
        btnCancelEditAbbr: $('#btnCancelEditAbbr'),
        btnResetAbbr: $('#btnResetAbbr'),

        contextMenu: $('#contextMenu'),
        menuEdit: $('#menuEdit'),
        menuDelete: $('#menuDelete'),

        scrollTopBtn: $('#scrollTopBtn'),
        appBar: $('#appBar')
      };

      // ---------- UTILITIES ----------
      function escapeHtml(str) {
        return str ? String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) : '';
      }
      function parseNumber(str) {
        const m = str && String(str).replace(/,/g, '.').replace(/\s+/g, '').match(/-?\d+(?:\.\d+)?/);
        return m ? parseFloat(m[0]) : NaN;
      }
      function debounce(fn, wait) {
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
      }
      function showToast(msg, duration = 2200) {
        document.querySelector('.toast-message')?.remove();
        const t = document.createElement('div');
        t.className = 'toast-message';
        t.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
        document.body.appendChild(t);
        setTimeout(() => {
          t.classList.add('fade-out');
          setTimeout(() => t.remove(), 350);
        }, duration);
      }

      // ---------- HISTORY ----------
      function getHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
      }
      function pushHistory(rawInput, summaryText, rowCount) {
        if (!rawInput.trim() || !rowCount) return;
        const hist = getHistory().filter(h => h.raw !== rawInput);
        hist.unshift({ raw: rawInput, summary: summaryText, count: rowCount, ts: Date.now() });
        localStorage.setItem(HISTORY_KEY, JSON.stringify(hist.slice(0, 15)));
        renderRecent();
      }
      function renderRecent() {
        const hist = getHistory();
        if (!hist.length) { el.recentBlock.classList.add('hidden'); return; }
        el.recentBlock.classList.remove('hidden');
        el.recentChips.innerHTML = hist.slice(0, 6).map((h, i) => {
          const time = new Date(h.ts).toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' });
          return `<button class="recent-chip" data-idx="${i}">
            <i class="fas fa-history" style="font-size:9px;"></i>
            <span class="time">${time}</span>
            <span>${h.count} chỉ số</span>
          </button>`;
        }).join('');
      }

      // ---------- CLEAN NAME (cache) ----------
      const nameRegex = /^\([^)]+\)\s*(.*)/;
      const innerContentRegex = /\s*\(([^)]+)\)/g;
      const validKeepText = ['inr','bệnh/ chứng r','bệnh/chứng r','alt','ast'];
      const cleanNameCache = new Map();
      const CLEAN_CACHE_LIMIT = 500;

      function cleanName(raw) {
        if (!raw) return '';
        if (cleanNameCache.has(raw)) return cleanNameCache.get(raw);
        let str = raw.trim().replace(/^["']|["']$/g, '');
        let m = str.match(nameRegex);
        let name = m ? m[1].trim() : str;
        name = name.replace(innerContentRegex, (match, inner) => {
          return validKeepText.includes(inner.trim().toLowerCase()) ? match : '';
        });
        const result = name.trim();
        if (cleanNameCache.size >= CLEAN_CACHE_LIMIT) cleanNameCache.clear();
        cleanNameCache.set(raw, result);
        return result;
      }

      // ---------- STATUS ----------
      const rangeRegex = /(\d+[.,]?\d*)\s*[-–]\s*(\d+[.,]?\d*)/;
      const leRegex = /(<=|≤)\s*(\d+[.,]?\d*)/;
      const lRegex = /<\s*(\d+[.,]?\d*)/;
      const geRegex = /(>=|≥)\s*(\d+[.,]?\d*)/;
      const gRegex = />\s*(\d+[.,]?\d*)/;

      function getStatus(valStr, rangeStr) {
        const val = parseNumber(valStr);
        if (isNaN(val) || !rangeStr) return 'unknown';
        let m;
        if ((m = rangeStr.match(rangeRegex))) return (val < parseNumber(m[1]) || val > parseNumber(m[2])) ? 'abnormal' : 'normal';
        if ((m = rangeStr.match(leRegex))) return val <= parseNumber(m[2]) ? 'normal' : 'abnormal';
        if ((m = rangeStr.match(lRegex)))  return val <  parseNumber(m[1]) ? 'normal' : 'abnormal';
        if ((m = rangeStr.match(geRegex))) return val >= parseNumber(m[1]) ? 'normal' : 'abnormal';
        if ((m = rangeStr.match(gRegex)))  return val >  parseNumber(m[1]) ? 'normal' : 'abnormal';
        return 'unknown';
      }

      // ---------- PARSE ----------
      function parseInputToRows(input) {
        const lines = input.split(/\r?\n/);
        const rows = [];
        for (const line of lines) {
          if (!line.trim()) continue;
          const cols = line.split('\t').map(c => c.trim()).filter(Boolean);
          if (cols.length >= 3 && /^\d+$/.test(cols[0])) {
            const refRange = cols[3] || '';
            rows.push({
              stt: cols[0],
              rawName: cols[1],
              cleanName: cleanName(cols[1]),
              value: cols[2],
              refRange,
              unit: cols[4] || '',
              _status: getStatus(cols[2], refRange)
            });
          }
        }
        return rows;
      }

      // ---------- COMPUTE ----------
      const SEP_INNER = { T3: ': ', T4: ': ', TSH: ': ', Tg: ': ' };
      function computeSummary(rows) {
        const htmlParts = [];
        const plainParts = [];
        for (const r of rows) {
          if (!r.value || r.value.trim().toLowerCase() === '- neg') continue;
          const n = (showAbbr && currentAbbrMap[r.cleanName]) ? currentAbbrMap[r.cleanName] : r.cleanName;
          const sep = SEP_INNER[n] || ' ';
          const u = (showUnit && r.unit) ? ' ' + r.unit : '';
          const ev = escapeHtml(r.value);
          const hv = r._status === 'abnormal' ? `<span class="abnormal-value">${ev}</span>` : ev;
          htmlParts.push(`${escapeHtml(n)}${sep}${hv}${escapeHtml(u)}`);
          plainParts.push(`${n}${sep}${r.value}${u}`);
        }
        const sepHtml  = copyFormat === 'newline' ? '<br>' : (copyFormat === 'semicolon' ? '; ' : ', ');
        const sepPlain = copyFormat === 'newline' ? '\n'  : (copyFormat === 'semicolon' ? '; ' : ', ');
        return { html: htmlParts.join(sepHtml), plain: plainParts.join(sepPlain) };
      }

      // ---------- UPDATE SUMMARY ----------
      function updateSummary() {
        const sel = currentRows.filter((_, i) => selectedIndices.includes(i));
        let newHtml = '';
        if (!sel.length) {
          newHtml = '<div class="empty-state"><i class="fas fa-file-medical-alt"></i><p>Chưa có dữ liệu. Dán kết quả xét nghiệm vào ô bên trái.</p></div>';
        } else {
          const { html } = computeSummary(sel);
          newHtml = html || '<div class="empty-state error"><i class="fas fa-exclamation-circle"></i><p>Không tìm thấy chỉ số hợp lệ.</p></div>';
        }
        if (newHtml !== lastSummaryHtml) {
          lastSummaryHtml = newHtml;
          el.summaryText.innerHTML = newHtml;
        }
      }

      function getSummaryPlainText() {
        return computeSummary(currentRows.filter((_, i) => selectedIndices.includes(i))).plain;
      }

      // ---------- UPDATE STATS ----------
      function updateStats() {
        el.totalIndicatorsSpan.textContent = currentRows.length;
        let abn = 0;
        for (const r of currentRows) if (r._status === 'abnormal') abn++;
        el.abnormalIndicatorsSpan.textContent = abn;
        el.selectedCountBadge.textContent = `${selectedIndices.length}/${currentRows.length}`;
        if (el.drawerCount) el.drawerCount.textContent = `${selectedIndices.length}/${currentRows.length}`;
      }

      // ---------- RENDER DETAIL ROWS ----------
      function renderTable() {
        const sig = currentRows.length + '|' + selectedIndices.join(',') + '|' + showAbbr + '|' + Object.keys(currentAbbrMap).length;
        if (sig === lastTableSignature) return;
        lastTableSignature = sig;

        if (!currentRows.length) {
          el.tableBody.innerHTML = '<div class="empty-drawer">Chưa có dữ liệu.</div>';
          updateStats();
          return;
        }

        const frag = [];
        for (let i = 0; i < currentRows.length; i++) {
          const r = currentRows[i];
          const st = r._status;
          const isSel = selectedIndices.includes(i);
          const n = (showAbbr && currentAbbrMap[r.cleanName]) ? currentAbbrMap[r.cleanName] : r.cleanName;
          const dotClass = st === 'abnormal' ? 'abn' : st === 'normal' ? 'norm' : 'unk';
          const meta = (r.refRange || '—') + (r.unit ? ' · ' + r.unit : '');
          frag.push(`
            <label class="detail-row ${isSel ? 'selected' : ''} ${st === 'abnormal' ? 'is-abn' : ''}" data-idx="${i}">
              <input type="checkbox" class="row-select" data-index="${i}" ${isSel ? 'checked' : ''}>
              <span class="detail-stt">${escapeHtml(r.stt)}</span>
              <div class="detail-info">
                <div class="detail-name">${escapeHtml(n)}</div>
                <div class="detail-meta">${escapeHtml(meta)}</div>
              </div>
              <span class="detail-value ${st === 'abnormal' ? 'abn' : ''}">${escapeHtml(r.value)}</span>
              <span class="detail-dot ${dotClass}"></span>
            </label>
          `);
        }
        el.tableBody.innerHTML = frag.join('');
        updateStats();
      }

      function syncSelection(indices) {
        selectedIndices = indices;
        document.querySelectorAll('.row-select').forEach(cb => {
          const idx = parseInt(cb.dataset.index, 10);
          const checked = indices.includes(idx);
          cb.checked = checked;
          const row = cb.closest('.detail-row');
          if (row) row.classList.toggle('selected', checked);
        });
        updateStats();
        updateSummary();
      }

      // ---------- PERFORM SUMMARIZE ----------
      function performSummarize() {
        const rows = parseInputToRows(el.dataTextarea.value);

        if (!rows.length) {
          const t = el.dataTextarea;
          t.style.transition = 'border-color 0.1s';
          t.style.borderColor = 'var(--abn)';
          setTimeout(() => { t.style.borderColor = ''; }, 500);
          showToast('Không có dữ liệu hợp lệ');
          currentRows = []; selectedIndices = [];
          lastSummaryHtml = ''; lastTableSignature = '';
          updateSummary();
          updateStats();
          renderTable();
          closeDrawer();
          return;
        }

        currentRows = rows;
        const main = currentRows.reduce((a, r, i) => SPECIAL_NAMES.includes(r.cleanName) ? [...a, i] : a, []);
        selectedIndices = main.length ? main : currentRows.map((_, i) => i);
        lastTableSignature = '';

        // Frame 1: blur & remove focus mode
        requestAnimationFrame(() => {
          el.dataTextarea.blur();
        });

        // Frame 2: DOM writes
        requestAnimationFrame(() => {
          if (!el.tableContainer.classList.contains('open')) {
            isTableDirty = true;
          } else {
            renderTable();
            isTableDirty = false;
          }
          updateSummary();
          updateStats();

          // Push history
          const sel = currentRows.filter((_, i) => selectedIndices.includes(i));
          const { plain } = computeSummary(sel);
          pushHistory(el.dataTextarea.value, plain, currentRows.length);

          // Idle: clipboard + toast + pulse
          const doSecondary = () => {
            if (plain) navigator.clipboard.writeText(plain).catch(() => {});
            showToast('Đã tóm tắt & sao chép');
            const card = el.outputCard;
            card.classList.remove('animate-pulse');
            requestAnimationFrame(() => {
              requestAnimationFrame(() => card.classList.add('animate-pulse'));
            });
          };
          if ('requestIdleCallback' in window) {
            requestIdleCallback(doSecondary, { timeout: 900 });
          } else {
            setTimeout(doSecondary, 60);
          }
        });
      }

      // ---------- DRAWER ----------
      function openDrawer() {
        if (isTableDirty) { renderTable(); isTableDirty = false; }
        el.tableContainer.classList.add('open');
        el.drawerBackdrop.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function closeDrawer() {
        el.tableContainer.classList.remove('open');
        el.drawerBackdrop.classList.remove('open');
        document.body.style.overflow = '';
      }

      // ---------- UI STATE ----------
      function updateUI() {
        el.unitIcon.className = showUnit ? 'fas fa-eye' : 'fas fa-eye-slash';
        el.unitBtnText.textContent = showUnit ? 'Có ĐV' : 'Đơn vị';
        el.toggleUnitBtn.classList.toggle('active', showUnit);

        el.abbrIcon.className = showAbbr ? 'fas fa-font' : 'fas fa-i';
        el.abbrBtnText.textContent = showAbbr ? 'Tên đủ' : 'Viết tắt';
        el.toggleAbbrBtn.classList.toggle('active', showAbbr);

        el.autoToggleBtn.classList.toggle('active', autoSummarizeEnabled);

        el.formatLabel.textContent = FORMAT_LABELS[copyFormat] || 'Phẩy';
        el.formatItems.forEach(i => {
          const active = i.dataset.value === copyFormat;
          i.classList.toggle('active', active);
          const check = i.querySelector('i');
          if (check) check.style.opacity = active ? '1' : '0';
        });
      }

      function setTheme(isDark) {
        document.body.classList.toggle('dark-mode', isDark);
        el.themeToggle.querySelector('i').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        localStorage.setItem(STORAGE.THEME, isDark ? 'dark' : 'light');
      }

      // ---------- FIREBASE: ABBR ----------
      onValue(abbrRef, (snapshot) => {
        currentAbbrMap = {}; firebaseAbbrList = [];
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach(key => {
            const item = data[key];
            firebaseAbbrList.push({ id: key, raw: item.raw, short: item.short });
            currentAbbrMap[item.raw] = item.short;
          });
        } else {
          Object.keys(DEFAULT_ABBR_MAP).forEach(k => push(abbrRef, { raw: k, short: DEFAULT_ABBR_MAP[k] }));
        }
        lastTableSignature = '';
        renderAbbrList();
        if (currentRows.length) { renderTable(); updateSummary(); }
      });

      function renderAbbrList() {
        if (!el.abbrListContainer) return;
        el.abbrListContainer.innerHTML = firebaseAbbrList.length ? firebaseAbbrList.map(item => `
          <div class="abbr-row">
            <span class="raw">${escapeHtml(item.raw)}</span>
            <span class="short">${escapeHtml(item.short)}</span>
            <div class="actions">
              <button class="icon-sm-btn edit-abbr-btn" data-id="${item.id}" title="Sửa"><i class="fas fa-edit"></i></button>
              <button class="icon-sm-btn delete-abbr-btn" data-id="${item.id}" title="Xóa"><i class="fas fa-trash-alt"></i></button>
            </div>
          </div>
        `).join('') : '<div class="empty-drawer">Chưa có viết tắt</div>';

        el.abbrCountBadge.textContent = firebaseAbbrList.length;

        document.querySelectorAll('.edit-abbr-btn').forEach(btn => btn.addEventListener('click', e => {
          const item = firebaseAbbrList.find(x => x.id === e.currentTarget.dataset.id);
          if (!item) return;
          el.editAbbrId.value = item.id;
          el.newAbbrKey.value = item.raw;
          el.newAbbrValue.value = item.short;
          el.abbrFormTitle.innerHTML = '<i class="fas fa-edit"></i> Chỉnh sửa';
          el.btnCancelEditAbbr.classList.remove('hidden');
          switchTab('tabAdd');
        }));

        document.querySelectorAll('.delete-abbr-btn').forEach(btn => btn.addEventListener('click', e => {
          if (confirm('Xóa viết tắt này trên toàn hệ thống?')) {
            remove(ref(db, `abbreviations/${e.currentTarget.dataset.id}`)).then(() => showToast('Đã xóa'));
          }
        }));
      }

      function resetAbbrForm() {
        el.editAbbrId.value = '';
        el.newAbbrKey.value = '';
        el.newAbbrValue.value = '';
        el.abbrFormTitle.innerHTML = '<i class="fas fa-plus-circle"></i> Thêm chỉ số mới';
        el.btnCancelEditAbbr.classList.add('hidden');
      }

      function switchTab(tabId) {
        el.tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
        el.tabContents.forEach(c => c.classList.toggle('active', c.id === tabId));
      }

      // ---------- FIREBASE: QUICK COPY ----------
      onValue(quickCopyRef, (snapshot) => {
        customQuickItems = [];
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach(key => {
            customQuickItems.push({ id: key, category: data[key].category, content: data[key].content });
          });
        }
        renderQuick();
      });

      function renderQuick() {
        if (!el.quickCopyGrid || !el.quickTabs) return;

        if (!customQuickItems.length) {
          el.quickTabs.innerHTML = '';
          el.quickCopyGrid.innerHTML = '<div class="empty-quick">Chưa có mẫu. Nhấn <b>+ Thêm</b> để tạo mẫu đầu tiên.</div>';
          return;
        }

        const groups = {};
        customQuickItems.forEach(i => {
          if (!groups[i.category]) groups[i.category] = [];
          groups[i.category].push(i);
        });

        const cats = Object.keys(groups).sort();
        if (activeQuickTab !== 'all' && !cats.includes(activeQuickTab)) activeQuickTab = 'all';

        // Tabs
        const tabs = ['all', ...cats];
        el.quickTabs.innerHTML = tabs.map(t => `
          <button class="quick-tab ${t === activeQuickTab ? 'active' : ''}" data-tab="${escapeHtml(t)}">
            ${t === 'all' ? 'Tất cả' : escapeHtml(t)}
          </button>
        `).join('');

        // Items
        let items = activeQuickTab === 'all' ? customQuickItems : groups[activeQuickTab] || [];
        const q = (el.quickSearch?.value || '').toLowerCase().trim();
        if (q) items = items.filter(i => i.content.toLowerCase().includes(q));

        if (!items.length) {
          el.quickCopyGrid.innerHTML = '<div class="empty-quick">Không có mẫu phù hợp.</div>';
          return;
        }

        el.quickCopyGrid.innerHTML = items.map(i => `
          <div class="quick-card" data-id="${i.id}">
            <div class="quick-card-body">
              <span class="quick-card-cat">${escapeHtml(i.category)}</span>
              <div class="quick-card-text">${escapeHtml(i.content).replace(/\n/g, '<br>')}</div>
            </div>
            <button class="quick-card-copy" title="Copy"><i class="fas fa-copy"></i></button>
          </div>
        `).join('');
      }

      function openEditModal(id) {
        const i = customQuickItems.find(x => x.id === id);
        if (!i) return;
        editingQuickId = i.id;
        el.modalTitle.innerHTML = '<i class="fas fa-edit"></i> Sửa mẫu';
        el.modalContent.value = i.content;
        const cats = [...new Set(['Liều dùng thuốc', 'Toàn thân', ...customQuickItems.map(x => x.category)])];
        el.catSelect.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') + '<option value="--new--">+ Nhóm mới…</option>';
        if (cats.includes(i.category)) { el.catSelect.value = i.category; el.catInput.style.display = 'none'; }
        else { el.catSelect.value = '--new--'; el.catInput.value = i.category; el.catInput.style.display = 'block'; }
        el.itemModal.classList.remove('hidden');
      }

      function deleteItem(id) {
        if (confirm('Xóa mẫu này?')) {
          remove(ref(db, `quickCopyItems/${id}`)).then(() => showToast('Đã xóa')).catch(e => showToast('Lỗi: ' + e.message));
        }
      }

      // ---------- BIND EVENTS ----------
      function bind() {

        // ---- Input ----
        el.dataTextarea.addEventListener('focus', () => {
          document.body.classList.add('focus-mode');
          el.clearTextBtn.classList.toggle('hidden', !el.dataTextarea.value.length);
        });
        el.dataTextarea.addEventListener('blur', () => {
          document.body.classList.remove('focus-mode');
        });

        const debouncedSummarize = debounce(() => {
          if (autoSummarizeEnabled) performSummarize();
        }, 300);

        el.dataTextarea.addEventListener('input', () => {
          el.clearTextBtn.classList.toggle('hidden', !el.dataTextarea.value.length);
          debouncedSummarize();
        });

        el.clearTextBtn.addEventListener('click', () => el.clearBtn.click());
        el.summarizeBtn.addEventListener('click', performSummarize);

        el.clearBtn.addEventListener('click', () => {
          el.dataTextarea.value = '';
          el.clearTextBtn.classList.add('hidden');
          currentRows = []; selectedIndices = [];
          lastSummaryHtml = ''; lastTableSignature = '';
          updateSummary(); updateStats(); renderTable();
          closeDrawer();
          showToast('Đã làm mới');
        });

        // ---- Copy summary ----
        el.copySummaryBtn.addEventListener('click', () => {
          const t = getSummaryPlainText();
          if (!t) return showToast('Chưa có dữ liệu');
          navigator.clipboard.writeText(t).then(() => {
            showToast('Đã copy tóm tắt');
            const orig = el.copySummaryBtn.innerHTML;
            el.copySummaryBtn.classList.add('copied');
            el.copySummaryBtn.innerHTML = '<i class="fas fa-check"></i> Đã copy';
            setTimeout(() => {
              el.copySummaryBtn.classList.remove('copied');
              el.copySummaryBtn.innerHTML = orig;
            }, 1800);
          });
        });

        // ---- Toggles ----
        el.toggleUnitBtn.addEventListener('click', () => {
          showUnit = !showUnit;
          localStorage.setItem(STORAGE.SHOW_UNIT, showUnit);
          updateUI();
          if (currentRows.length) updateSummary();
        });
        el.toggleAbbrBtn.addEventListener('click', () => {
          showAbbr = !showAbbr;
          localStorage.setItem(STORAGE.SHOW_ABBR, showAbbr);
          updateUI();
          if (currentRows.length) { renderTable(); updateSummary(); }
        });
        el.autoToggleBtn.addEventListener('click', () => {
          autoSummarizeEnabled = !autoSummarizeEnabled;
          localStorage.setItem(STORAGE.AUTO_SUMMARIZE, autoSummarizeEnabled);
          updateUI();
          showToast(autoSummarizeEnabled ? 'Bật tự động' : 'Tắt tự động');
        });
        el.themeToggle.addEventListener('click', () => {
          setTheme(!document.body.classList.contains('dark-mode'));
        });

        // ---- Format dropdown ----
        el.formatDropdownToggle.addEventListener('click', e => {
          e.stopPropagation();
          el.formatDropdownMenu.classList.toggle('hidden');
        });
        document.addEventListener('click', () => el.formatDropdownMenu.classList.add('hidden'));
        el.formatItems.forEach(i => i.addEventListener('click', e => {
          e.stopPropagation();
          copyFormat = i.dataset.value;
          localStorage.setItem(STORAGE.COPY_FORMAT, copyFormat);
          el.formatDropdownMenu.classList.add('hidden');
          updateUI();
          if (currentRows.length) updateSummary();
        }));

        // ---- Drawer ----
        el.toggleTableBtn.addEventListener('click', openDrawer);
        el.openDrawerBtn.addEventListener('click', openDrawer);
        el.drawerClose.addEventListener('click', closeDrawer);
        el.drawerApply.addEventListener('click', closeDrawer);
        el.drawerBackdrop.addEventListener('click', closeDrawer);

        el.tableBody.addEventListener('change', (e) => {
          if (!e.target.classList.contains('row-select')) return;
          const i = parseInt(e.target.dataset.index, 10);
          if (e.target.checked && !selectedIndices.includes(i)) selectedIndices.push(i);
          else selectedIndices = selectedIndices.filter(x => x !== i);
          selectedIndices.sort((a, b) => a - b);
          const row = e.target.closest('.detail-row');
          if (row) row.classList.toggle('selected', e.target.checked);
          updateStats();
          updateSummary();
        });

        el.tableBody.addEventListener('click', (e) => {
          const row = e.target.closest('.detail-row');
          if (!row) return;
          if (e.target.tagName === 'INPUT') return;
          const cb = row.querySelector('.row-select');
          if (!cb) return;
          cb.checked = !cb.checked;
          cb.dispatchEvent(new Event('change', { bubbles: true }));
        });

        // ---- Drawer toolbar ----
        el.selectMainBtn.addEventListener('click', () => {
          syncSelection(currentRows.reduce((a, r, i) => SPECIAL_NAMES.includes(r.cleanName) ? [...a, i] : a, []));
        });
        el.selectAbnormalBtn.addEventListener('click', () => {
          syncSelection(currentRows.reduce((a, r, i) => r._status === 'abnormal' ? [...a, i] : a, []));
        });
        el.selectAllBtn.addEventListener('click', () => syncSelection(currentRows.map((_, i) => i)));
        el.deselectAllBtn.addEventListener('click', () => syncSelection([]));

        // ---- Recent history ----
        el.recentChips.addEventListener('click', (e) => {
          const chip = e.target.closest('.recent-chip');
          if (!chip) return;
          const idx = parseInt(chip.dataset.idx, 10);
          const hist = getHistory();
          if (hist[idx]) {
            el.dataTextarea.value = hist[idx].raw;
            performSummarize();
          }
        });

        // ---- Quick copy ----
        el.quickTabs.addEventListener('click', (e) => {
          const tab = e.target.closest('.quick-tab');
          if (!tab) return;
          activeQuickTab = tab.dataset.tab;
          renderQuick();
        });
        el.quickSearch.addEventListener('input', debounce(() => renderQuick(), 200));
        el.quickCopyGrid.addEventListener('click', (e) => {
          const card = e.target.closest('.quick-card');
          if (!card) return;
          const item = customQuickItems.find(x => x.id === card.dataset.id);
          if (item) {
            navigator.clipboard.writeText(item.content).then(() => showToast('Đã sao chép!'));
          }
        });
        el.quickCopyGrid.addEventListener('contextmenu', (e) => {
          const card = e.target.closest('.quick-card');
          if (!card) return;
          e.preventDefault();
          contextMenuTargetId = card.dataset.id;
          el.contextMenu.classList.remove('hidden');
          el.contextMenu.style.left = Math.min(e.pageX, window.innerWidth - 180) + 'px';
          el.contextMenu.style.top = Math.min(e.pageY, window.innerHeight - 100) + 'px';
        });

        // ---- Add/Edit quick copy modal ----
        el.btnAddQuickCopy.addEventListener('click', () => {
          editingQuickId = null;
          el.modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> Thêm mẫu mới';
          el.modalContent.value = '';
          const cats = [...new Set(['Liều dùng thuốc', 'Toàn thân', ...customQuickItems.map(i => i.category)])];
          el.catSelect.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') + '<option value="--new--">+ Nhóm mới…</option>';
          el.catInput.style.display = 'none';
          el.catInput.value = '';
          el.itemModal.classList.remove('hidden');
        });
        el.catSelect.addEventListener('change', () => {
          const isNew = el.catSelect.value === '--new--';
          el.catInput.style.display = isNew ? 'block' : 'none';
          if (isNew) el.catInput.focus();
        });
